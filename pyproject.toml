[project]
name = "befave"
version = "0.1.1"
description = "Keep favorites in sync across Chrome, Firefox, Safari and Opera via a deduplicated sqlite3 database"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "David Jackson", email = "pyguy411@gmail.com" }
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
befave = "befave.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.5"]
build-backend = "uv_build"
